name: Polish woodland release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sproutbook-woodland-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Download and verify the existing APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/$GH_REPO/$RELEASE_COMMIT/SproutBook-3.4.0-debug.apk" \
            --output SproutBook-3.4.0-debug.apk
          for name in SproutBook-3.4.0-debug.apk.sha256 docs/RELEASE-3.4.0.md; do
            output="${name##*/}"
            gh api -H 'Accept: application/vnd.github.raw+json' "/repos/$GH_REPO/contents/$name?ref=$RELEASE_COMMIT" > "$output"
          done
          sha256sum -c SproutBook-3.4.0-debug.apk.sha256
      - name: Decorate the existing GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release view V1.0 >/dev/null
          gh release edit V1.0 \
            --title 'SproutBook 3.4.0 · Woodland preview' \
            --notes-file RELEASE-3.4.0.md \
            --prerelease
          gh release upload V1.0 SproutBook-3.4.0-debug.apk.sha256 --clobber
