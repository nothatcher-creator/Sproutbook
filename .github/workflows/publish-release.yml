name: Publish woodland motion release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sproutbook-woodland-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
      DOWNLOAD_BASE: https://sproutbook-woodland.nothatch.chatgpt.site/downloads
    steps:
      - name: Download and verify the completed 3.5 artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$DOWNLOAD_BASE/SproutBook-3.5.0-debug.apk" --output SproutBook-3.5.0-debug.apk
          # Static hosting limits individual files. Reassemble the original source ZIP without changing any bytes.
          for part in 1 2; do
            curl --fail --location --retry 3 "$DOWNLOAD_BASE/SproutBook-3.5.0-source.zip.part$part" --output "source.part$part"
          done
          cat source.part1 source.part2 > SproutBook-3.5.0-source.zip
          for name in SHA256SUMS-3.5.0.txt docs/RELEASE-3.5.0.md; do
            output="${name##*/}"
            gh api -H 'Accept: application/vnd.github.raw+json' "/repos/$GH_REPO/contents/$name?ref=$RELEASE_COMMIT" > "$output"
          done
          sha256sum -c SHA256SUMS-3.5.0.txt
          unzip -tq SproutBook-3.5.0-source.zip
      - name: Publish APK and complete source as a new prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.5.0 >/dev/null 2>&1; then
            gh release edit v3.5.0 --title 'SproutBook 3.5.0 · Woodland in motion' --notes-file RELEASE-3.5.0.md --prerelease
          else
            gh release create v3.5.0 --target "$RELEASE_COMMIT" --title 'SproutBook 3.5.0 · Woodland in motion' --notes-file RELEASE-3.5.0.md --prerelease
          fi
          gh release upload v3.5.0 SproutBook-3.5.0-debug.apk SproutBook-3.5.0-source.zip SHA256SUMS-3.5.0.txt --clobber
